<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everything You Need by fjcoolcat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a5c1a 0%, #0d2e0d 50%, #1a472a 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .header h1 {
            font-size: 3em;
            background: linear-gradient(45deg, #ffd700, #ffed4e, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .header p {
            color: #a8e6a8;
            font-size: 1.2em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Admin Login Button */
        .admin-login-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a5c1a;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            transition: all 0.3s;
            z-index: 100;
        }

        .admin-login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a3a1a 0%, #0d1f0d 100%);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #ffd700;
            font-size: 1.8em;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 1.5em;
            cursor: pointer;
            padding: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #a8e6a8;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #2d5a2d;
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a5c1a;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        /* Shop Grid */
        .shop-section h2 {
            text-align: center;
            font-size: 2.5em;
            color: #ffd700;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .item-card {
            background: linear-gradient(135deg, rgba(26, 60, 26, 0.9) 0%, rgba(13, 30, 13, 0.9) 100%);
            border: 2px solid #2d5a2d;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .item-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .item-card:hover {
            transform: translateY(-5px);
            border-color: #ffd700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .item-card:hover::before {
            opacity: 1;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .item-name {
            font-size: 1.5em;
            color: #ffd700;
            font-weight: bold;
        }

        .item-price {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a5c1a;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .diamond-icon {
            font-size: 1.2em;
        }

        .item-description {
            color: #a8e6a8;
            line-height: 1.6;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .order-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #2d5a2d, #3d7a3d);
            color: #fff;
            border: 2px solid #4a9a4a;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }

        .order-btn:hover {
            background: linear-gradient(45deg, #3d7a3d, #4d9a4d);
            transform: scale(1.02);
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4444;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            z-index: 2;
            font-weight: bold;
        }

        .admin-mode .delete-btn {
            display: block;
        }

        /* Agreement Modal */
        .agreement-text {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #ffd700;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #ffed4e;
            font-style: italic;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #ffd700;
        }

        /* Orders Section */
        .orders-section {
            background: linear-gradient(135deg, rgba(26, 60, 26, 0.8) 0%, rgba(13, 30, 13, 0.8) 100%);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            margin-top: 40px;
            display: none;
        }

        .orders-section.active {
            display: block;
        }

        .orders-section h2 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .order-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid #2d5a2d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: center;
        }

        .order-info {
            color: #a8e6a8;
        }

        .order-info strong {
            color: #ffd700;
            display: block;
            margin-bottom: 5px;
        }

        .status-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .status-pending {
            background: #ffd700;
            color: #1a5c1a;
        }

        .status-completed {
            background: #4a9a4a;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6a9a6a;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .items-grid { grid-template-columns: 1fr; }
            .order-item { grid-template-columns: 1fr; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0d2e0d;
        }

        ::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ffed4e;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a5c1a;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transform: translateX(400px);
            transition: transform 0.3s;
            z-index: 2000;
        }

        .toast.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <!-- Background Particles -->
    <div class="particles" id="particles"></div>

    <!-- Admin Login Button -->
    <button class="admin-login-btn" onclick="openAdminLogin()">🔒 Admin Login</button>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Everything You Need</h1>
            <p>by fjcoolcat - Premium Minecraft Shop</p>
        </div>

        <!-- Shop Section -->
        <div class="shop-section">
            <h2>💎 Shop Items</h2>
            <div class="items-grid" id="itemsGrid">
                <!-- Items will be loaded here -->
            </div>
        </div>

        <!-- Orders Section (Admin Only) -->
        <div class="orders-section" id="ordersSection">
            <h2>📋 Orders</h2>
            <div id="ordersList"></div>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div class="modal" id="adminLoginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🔐 Admin Login</h2>
                <button class="close-btn" onclick="closeModal('adminLoginModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUser" placeholder="Enter username...">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" placeholder="Enter password...">
            </div>
            <button class="submit-btn" onclick="loginAdmin()">Login</button>
        </div>
    </div>

    <!-- Add Item Modal (Admin Only) -->
    <div class="modal" id="addItemModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>➕ Add New Item</h2>
                <button class="close-btn" onclick="closeModal('addItemModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" id="itemName" placeholder="e.g., Netherite Sword">
            </div>
            <div class="form-group">
                <label>Price (Diamonds)</label>
                <input type="number" id="itemPrice" placeholder="e.g., 64" min="1">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="itemDesc" rows="3" placeholder="Describe the item..."></textarea>
            </div>
            <button class="submit-btn" onclick="addItem()">Add Item</button>
        </div>
    </div>

    <!-- Order Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🛒 Place Order</h2>
                <button class="close-btn" onclick="closeModal('orderModal')">&times;</button>
            </div>
            <div id="orderItemDetails"></div>
            <div class="agreement-text">
                "By accepting this you are not allowed to scam be at all every"
            </div>
            <div class="form-group">
                <label>Discord Username</label>
                <input type="text" id="discordUser" placeholder="e.g., user#1234">
            </div>
            <div class="form-group">
                <label>In-Game Name</label>
                <input type="text" id="ignUser" placeholder="Your Minecraft username">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="agreeCheck">
                <label for="agreeCheck">I agree to the terms above</label>
            </div>
            <button class="submit-btn" onclick="submitOrder()">Confirm Order</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
        // Initialize particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // Data Storage
        let items = JSON.parse(localStorage.getItem('shopItems')) || [
            { id: 1, name: 'Diamond Sword', price: 32, description: 'Sharpness V, Unbreaking III, Mending - Perfect for PvP!' },
            { id: 2, name: 'Netherite Pickaxe', price: 64, description: 'Efficiency V, Fortune III - Mine like a pro!' },
            { id: 3, name: 'Elytra', price: 128, description: 'Fly through the skies with this rare item!' }
        ];
        let orders = JSON.parse(localStorage.getItem('shopOrders')) || [];
        let currentItem = null;
        let isAdmin = false;

        // Load Items
        function loadItems() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            
            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <h3>No items available</h3>
                        <p>Check back later or contact an admin!</p>
                    </div>
                `;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                if (isAdmin) card.classList.add('admin-mode');
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteItem(${item.id})" title="Delete Item">×</button>
                    <div class="item-header">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">
                            <span class="diamond-icon">💎</span>
                            ${item.price}
                        </div>
                    </div>
                    <div class="item-description">${item.description}</div>
                    <button class="order-btn" onclick="openOrder(${item.id})">Order Now</button>
                `;
                grid.appendChild(card);
            });

            // Add "Add Item" card for admin
            if (isAdmin) {
                const addCard = document.createElement('div');
                addCard.className = 'item-card';
                addCard.style.border = '2px dashed #ffd700';
                addCard.style.display = 'flex';
                addCard.style.alignItems = 'center';
                addCard.style.justifyContent = 'center';
                addCard.style.cursor = 'pointer';
                addCard.style.minHeight = '200px';
                addCard.innerHTML = `
                    <div style="text-align: center; color: #ffd700;">
                        <div style="font-size: 3em; margin-bottom: 10px;">+</div>
                        <div style="font-size: 1.2em; font-weight: bold;">Add New Item</div>
                    </div>
                `;
                addCard.onclick = () => openModal('addItemModal');
                grid.appendChild(addCard);
            }
        }

        // Modal Functions
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function openAdminLogin() {
            if (isAdmin) {
                logoutAdmin();
                return;
            }
            openModal('adminLoginModal');
        }

        // Admin Functions
        function loginAdmin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            if (user === 'Fjowner' && pass === '121') {
                isAdmin = true;
                closeModal('adminLoginModal');
                document.querySelector('.admin-login-btn').textContent = '🔓 Logout';
                document.getElementById('ordersSection').classList.add('active');
                loadItems();
                loadOrders();
                showToast('Welcome, Admin! 🎉');
            } else {
                showToast('Invalid credentials! ❌');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.querySelector('.admin-login-btn').textContent = '🔒 Admin Login';
            document.getElementById('ordersSection').classList.remove('active');
            loadItems();
            showToast('Logged out successfully');
        }

        function addItem() {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const desc = document.getElementById('itemDesc').value;

            if (!name || !price || !desc) {
                showToast('Please fill all fields! ⚠️');
                return;
            }

            const newItem = {
                id: Date.now(),
                name: name,
                price: parseInt(price),
                description: desc
            };

            items.push(newItem);
            localStorage.setItem('shopItems', JSON.stringify(items));
            
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemDesc').value = '';
            
            closeModal('addItemModal');
            loadItems();
            showToast('Item added successfully! ✅');
        }

        function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            items = items.filter(item => item.id !== id);
            localStorage.setItem('shopItems', JSON.stringify(items));
            loadItems();
            showToast('Item deleted! 🗑️');
        }

        // Order Functions
        function openOrder(itemId) {
            currentItem = items.find(item => item.id === itemId);
            if (!currentItem) return;

            document.getElementById('orderItemDetails').innerHTML = `
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #ffd700;">
                    <strong style="color: #ffd700; font-size: 1.2em;">${currentItem.name}</strong><br>
                    <span style="color: #a8e6a8;">Price: 💎 ${currentItem.price} Diamonds</span>
                </div>
            `;
            
            document.getElementById('discordUser').value = '';
            document.getElementById('ignUser').value = '';
            document.getElementById('agreeCheck').checked = false;
            
            openModal('orderModal');
        }

        function submitOrder() {
            const discord = document.getElementById('discordUser').value;
            const ign = document.getElementById('ignUser').value;
            const agreed = document.getElementById('agreeCheck').checked;

            if (!discord || !ign) {
                showToast('Please fill in all fields! ⚠️');
                return;
            }

            if (!agreed) {
                showToast('You must accept the agreement! ⚠️');
                return;
            }

            const order = {
                id: Date.now(),
                itemName: currentItem.name,
                itemPrice: currentItem.price,
                discord: discord,
                ign: ign,
                status: 'pending',
                date: new Date().toLocaleString()
            };

            orders.push(order);
            localStorage.setItem('shopOrders', JSON.stringify(orders));
            
            closeModal('orderModal');
            showToast('Order placed successfully! ✅');
            
            if (isAdmin) loadOrders();
        }

        function loadOrders() {
            const container = document.getElementById('ordersList');
            
            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #6a9a6a;">No orders yet</p>';
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="order-item">
                    <div class="order-info">
                        <strong>Item</strong>
                        ${order.itemName}<br>
                        <small style="color: #ffd700;">💎 ${order.itemPrice}</small>
                    </div>
                    <div class="order-info">
                        <strong>Discord</strong>
                        ${order.discord}
                    </div>
                    <div class="order-info">
                        <strong>IGN</strong>
                        ${order.ign}
                    </div>
                    <button class="status-btn ${order.status === 'pending' ? 'status-pending' : 'status-completed'}" 
                            onclick="toggleStatus(${order.id})">
                        ${order.status === 'pending' ? '⏳ Pending' : '✅ Done'}
                    </button>
                </div>
            `).join('');
        }

        function toggleStatus(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = order.status === 'pending' ? 'completed' : 'pending';
                localStorage.setItem('shopOrders', JSON.stringify(orders));
                loadOrders();
            }
        }

        // Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Close modals on outside click
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        }

        // Initial Load
        loadItems();
    </script>
</body>
</html>
